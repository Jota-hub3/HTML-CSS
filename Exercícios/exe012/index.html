<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>

<body>

    <h1>Inserindo vídeos hospedados localmente</h1>

    <p>Esse vídeo está hospedado no meu próprio servidor.</p>

    <video width="500"
        poster="capa/Gemini_Generated_Image_os9k78os9k78os9k.png"
        controls
        autoplay
        muted>

        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/Meu-Video.webm" type="video/webm">

        Seu navegador não possui compatibilidade com reprodução de vídeos.

    </video>

    <h1>Inserindo vídeos incorporados</h1>

    <p>Esse vídeo está hospedado no servidor do YouTube.</p>

    <iframe width="560"
        height="315"
        src="https://www.youtube.com/embed/SGYFuZ_PeWg"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>

</body>

</html>
